/* VOICE everyday tool for a busy CT technologist: calm, exact, a little proud of the craft
   IDEA a reading-room lightbox: white glowing ground, deep blue film panels, a live CT slice you can window yourself
   PICTURE a simulated axial slice (head or chest) rendered from a Hounsfield map; drag or slide to change W/L, presets, a finding to reveal
   COLOUR lightbox white or night; film #0f1c2a; trefoil yellow for actions; magenta for warnings
   TYPE Archivo condensed 800 for titles + Archivo; IBM Plex Mono only for the scanner overlay
   LAYOUT phone first; today screen opens with the slice, then the day, reviews and the curiosity; six-item bottom bar */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0a1118);--ink:light-dark(#0e1a26,#e6eef5);--mute:light-dark(#51606e,#9aabb9);--line:light-dark(#dfe6ec,#1f2d3a);--card:light-dark(#f2f5f8,#111d29);--film:#0f1c2a;--filmInk:#e6eef5;--filmMute:#8fa6ba;--yel:#ffcc29;--mag:light-dark(#b4176b,#ff6fb1);--ok:light-dark(#0f7a5a,#4fd1a5)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.55 Archivo,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;font-stretch:80%;letter-spacing:-.01em;margin:0;line-height:1.08}
h1{font-size:clamp(30px,8vw,44px);font-weight:800}
h2{font-size:24px;font-weight:800;margin-bottom:10px}
h3{font-size:18px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:0 max(16px,4vw)}
.top{padding-top:18px;padding-bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top small{display:block;color:var(--mute);font-size:15px;margin-top:4px}
.mode{font-size:13px;color:var(--mute);text-align:right;white-space:nowrap}
.sec{padding:20px 0 6px}
.sub{color:var(--mute)}
.note{color:var(--mute);font-size:14px;margin-top:8px}
.film{background:var(--film);color:var(--filmInk);border-radius:18px;padding:12px}
.viewer{position:relative;aspect-ratio:1/1;max-width:520px;margin:0 auto;border-radius:12px;overflow:hidden;background:#000;touch-action:pan-y;cursor:ew-resize}
.viewer canvas{width:100%;height:100%;display:block}
.ov{position:absolute;font:500 11px/1.35 "IBM Plex Mono",ui-monospace,monospace;color:#cfe3f3;text-shadow:0 1px 2px #000;pointer-events:none;white-space:nowrap}
.ov.om{font-size:13px;color:#ffcc29;opacity:.9}.ov.ot{top:6px;left:50%;transform:translateX(-50%)}.ov.ol{left:8px;top:50%;transform:translateY(-50%)}.ov.or{right:8px;top:50%;transform:translateY(-50%)}
.ov.tl{top:8px;left:10px}.ov.tr{top:8px;right:10px;text-align:right}.ov.bl{bottom:8px;left:10px}.ov.br{bottom:8px;right:10px;text-align:right}
.ov b{font-size:15px;color:#fff}
.scalebar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:100%;display:flex;flex-direction:column;align-items:center;pointer-events:none;font:500 11px 'IBM Plex Mono',monospace;color:#cfe3f3}
.scalebar i{display:block;height:6px;border:1.5px solid #cfe3f3;border-top:0}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font-weight:600}
.busy[hidden]{display:none}
[data-cw][hidden]{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips button{flex:none;min-height:40px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:none;font-size:15px;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.film .chips button{border-color:#2a3d52;color:var(--filmInk)}
.film .chips button[aria-pressed=true]{background:var(--yel);color:#0e1a26;border-color:var(--yel)}
.vctl{display:grid;gap:8px;margin-top:10px}
.sl{display:grid;grid-template-columns:72px minmax(0,1fr) 64px;align-items:center;gap:8px;font-size:14px;color:var(--filmMute)}
.sl output{text-align:right;color:var(--filmInk);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--yel);min-height:36px;padding:0;border:0;background:none}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:15px;min-height:40px}
.sw input{width:22px;height:22px;min-height:0;accent-color:var(--yel)}
.cap{font-size:14px;color:var(--filmMute);margin-top:6px}
.cap b{color:var(--filmInk)}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--yel);border-color:var(--yel);color:#0e1a26}
.btn.dng{background:var(--mag);border-color:var(--mag);color:#fff}
.btn.full{width:100%}
.btn.sm{min-height:40px;padding:0 12px;font-size:15px}
.btn:disabled{opacity:.5}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.card{background:var(--card);border-radius:14px;padding:14px;border:0;text-align:left;display:grid;gap:6px;align-content:start}
.card .big{font:800 34px/1 Archivo,sans-serif;font-stretch:80%}
.card small{color:var(--mute);font-size:14px}
.tl-list{display:grid}
.ti{display:grid;grid-template-columns:62px 6px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-height:54px}
.ti .t{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.ti .t small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.ti .bar{width:6px;align-self:stretch;border-radius:3px;background:var(--line)}
.ti.trabalho .bar{background:#2f6fb3}.ti.aula .bar{background:#8a4fd6}.ti.estudo .bar{background:var(--yel)}.ti.outro .bar{background:#8a99a8}.ti.prova .bar{background:var(--mag)}.ti.livre .bar{background:repeating-linear-gradient(180deg,var(--ok) 0 4px,transparent 4px 8px)}
.ti.livre{color:var(--ok)}
.ti b{font-weight:600}
.ti small{color:var(--mute);font-size:14px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:6px 0 10px}
.days button{min-height:56px;border-radius:12px;border:1px solid var(--line);background:none;display:grid;place-items:center;font-size:13px;line-height:1.1;padding:4px 0}
.days button b{font-size:17px}
.days button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days button.today:not([aria-pressed=true]){border-color:var(--yel);border-width:2px}
.sum4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sum4 div{background:var(--card);border-radius:10px;padding:8px}
.sum4 b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.sum4 small{color:var(--mute);font-size:12px}
.seg{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px;margin:12px 0}
.seg button{flex:1;min-height:44px;border:0;border-radius:9px;background:none;font-weight:600;color:var(--mute);font-size:15px}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.flash{background:var(--film);color:var(--filmInk);border-radius:18px;min-height:260px;padding:22px;display:grid;align-content:center;gap:12px;text-align:center;border:0;width:100%;cursor:pointer}
.flash small{color:var(--filmMute);font-size:13px}
.flash .q{font:700 23px/1.25 Archivo,sans-serif;font-stretch:85%}
.flash .a{font-size:18px;line-height:1.45;color:#fff}
.opts{display:grid;gap:8px;margin-top:12px}
.opts button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left;padding:10px 14px}
.opts button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--bg))}
.opts button.no{border-color:var(--mag);background:color-mix(in srgb,var(--mag) 12%,var(--bg))}
.ring{display:grid;place-items:center;margin:10px auto;width:min(260px,70vw);aspect-ratio:1/1;position:relative}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .tm{font:800 54px/1 Archivo,sans-serif;font-stretch:80%;font-variant-numeric:tabular-nums}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:14px;color:var(--mute);font-weight:500}
input:not([type=range]):not([type=checkbox]),select,textarea{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:16px;width:100%}
textarea{min-height:96px;resize:vertical}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.dchk{display:flex;flex-wrap:wrap;gap:6px}
.dchk label{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:40px;border-radius:10px;border:1px solid var(--line);font-size:14px;cursor:pointer}
.dchk input{position:absolute;opacity:0;pointer-events:none}
.dchk label:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid}
.li{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;min-height:56px}
.li .tx{flex:1}
.li small{display:block;color:var(--mute);font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:13px;color:var(--mute);font-weight:600}
.tbl td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.src{font-size:13px;color:var(--mute);margin-top:8px}
.warn{background:color-mix(in srgb,var(--mag) 11%,var(--bg));border:1px solid color-mix(in srgb,var(--mag) 45%,var(--line));border-radius:12px;padding:12px 14px;font-size:15px}
.okbox{background:color-mix(in srgb,var(--ok) 11%,var(--bg));border-radius:12px;padding:12px 14px;font-size:15px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.case{border:0;background:var(--film);color:var(--filmInk);border-radius:14px;overflow:hidden;padding:0;text-align:left}
.case img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#000}
.case span{display:block;padding:8px 10px 10px;font-size:14px}
.case small{color:var(--filmMute);display:block;font-size:12px}
.edit{position:relative;background:#000;border-radius:12px;overflow:hidden;touch-action:none}
.edit canvas{width:100%;display:block}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin-bottom:10px}
.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--yel)}
.progress{height:10px;border-radius:6px;background:var(--card);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok)}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.step input{width:24px;height:24px;flex:none;accent-color:var(--ok);margin-top:1px}
.step.done span{color:var(--mute);text-decoration:line-through}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px))}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;justify-content:center;text-decoration:none;color:var(--mute);font-size:11px;white-space:nowrap;border-radius:10px}
.nav a svg{width:24px;height:24px}
.nav a[aria-current=page]{color:var(--ink);font-weight:700}
.nav a[aria-current=page] svg{color:var(--mag)}
.shade{position:fixed;inset:0;z-index:10;background:rgba(4,10,18,.6);display:flex;align-items:flex-end;justify-content:center}
.shade[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px max(16px,4vw) calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.sheet.dark{background:#05090e;color:#e6eef5}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:none;font-size:22px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;max-width:calc(100vw - 32px);font-weight:500}
.toast[hidden]{display:none}
.view[hidden]{display:none}
.ai{white-space:pre-wrap;background:var(--card);border-radius:12px;padding:12px;font-size:15px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--mag) 12%,var(--card))}
.confirm[hidden]{display:none}
@media(min-width:760px){.hoje-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}}
@media(max-width:400px){.sum4 b{font-size:17px}.ti{grid-template-columns:54px 6px minmax(0,1fr) auto}}

/* atlas + jogo */
.atlas{background:radial-gradient(90% 70% at 50% 35%,#0d1f2e,#050b11);border-radius:14px;margin-top:8px;overflow:hidden;touch-action:manipulation}
.atlas svg{width:100%;height:min(64vh,540px);display:block}
.atlas .st{cursor:pointer}
.atlas .st .f,.atlas .st .s{transition:fill .15s,stroke .15s}
.atlas .st.sel .f{fill:var(--yel)}.atlas .st.sel .s{stroke:var(--yel)}.atlas .st.sel .s.hl{stroke:#fff3c4}
.atlas .st.sel{filter:drop-shadow(0 0 2px rgba(255,204,41,.95))}
.atlas .st.bad .f{fill:#ff6fb1}.atlas .st.bad .s{stroke:#ff6fb1}
.atlas.L-ossos .og{display:none}
.atlas.L-orgaos .bn{opacity:.13;pointer-events:none}
.atlas.L-tudo .og{opacity:.9}
.atlas.pel-f .masc,.atlas.pel-m .fem{display:none}
.atlas-info{position:fixed;left:8px;right:8px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:6;max-width:620px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-height:36vh;overflow:auto}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--card)}
.tag.osso{background:#e9eef2;color:#0e1a26}.tag.orgao{background:#f2b8c0;color:#0e1a26}
.alist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.alist button{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:none;font-size:14px}
.alist button.seen{background:var(--card)}
.alist button.seen::before{content:"✓ ";color:var(--ok);font-weight:700}
.aban{display:grid;gap:2px;text-align:center;padding:8px 4px 10px;color:var(--filmInk)}
.aban small{color:var(--filmMute);font-size:13px}.aban span{font-size:14px;color:var(--filmMute)}
.aban b{font-size:26px;font-stretch:80%;font-weight:800;color:var(--yel);line-height:1.1}
.aban .ok-t{color:#4fd1a5;font-weight:700;font-size:15px}.aban .no-t{color:#ff6fb1;font-size:14px}
.lvl{background:var(--card);border-radius:16px;padding:14px;margin-bottom:14px}
.lvl-top{display:flex;gap:12px;align-items:center}
.lvl-n{width:46px;height:46px;border-radius:50%;background:var(--yel);color:#0e1a26;font-weight:800;font-size:21px;display:grid;place-items:center;flex:none}
.xpbar{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.xpbar i{display:block;height:100%;background:var(--yel);border-radius:99px}
.lvl small{color:var(--mute);font-size:13px}
.fire{font-weight:800;font-size:18px;white-space:nowrap}
.miss{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.mi{display:flex;gap:8px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.25;min-height:54px}
.mi>span:first-child{font-size:20px}
.mi small{display:block;color:var(--mute);font-size:12px}
.mi.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--bg))}
.bdg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.bdg div{background:var(--card);border-radius:14px;padding:12px;text-align:center;display:grid;gap:2px}
.bdg span{font-size:32px}.bdg small{color:var(--mute);font-size:13px}
.bdg .lk{opacity:.45;filter:grayscale(1)}
.xpop{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;background:var(--yel);color:#0e1a26;font-weight:800;border-radius:999px;padding:4px 14px;animation:xp 1s ease-out forwards;pointer-events:none}
@keyframes xp{0%{opacity:0;transform:translate(-50%,8px)}20%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-18px)}}
.confete{position:fixed;inset:0;z-index:30;pointer-events:none;width:100%;height:100%}
.combo{display:inline-block;margin-left:6px;font-weight:800;color:var(--mag)}
@media(prefers-reduced-motion:reduce){.xpop{animation:none}.atlas .st .f,.atlas .st .s{transition:none}}

/* ===== estação de laudo ===== */
:root,:root[data-theme]{color-scheme:dark;--bg:#0c161f;--ink:#e8eff5;--mute:#93a8b9;--line:#21344428;--line:#223443;--card:#132230;--card2:#182a39;--film:#060d13;--filmInk:#e8eff5;--filmMute:#88a0b3;--yel:#ffcc29;--mag:#ff6fb1;--ok:#4fd1a5;--cyan:#5cc8e6}
html,body{background:var(--bg)}
body{background:radial-gradient(120% 60% at 50% -10%,#14283a 0%,var(--bg) 55%) fixed,var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.appbar{position:sticky;top:0;z-index:7;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(16px,4vw) 10px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid transparent;transition:border-color .2s}
.appbar.sc{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:9px;font:800 19px/1 Archivo,system-ui,sans-serif;font-stretch:78%;letter-spacing:.005em}
.brand svg{width:28px;height:28px;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px 0 5px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;color:var(--ink)}
.pill .pn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--yel);color:#0c161f;font-weight:800;font-size:13px}
.top{padding-top:6px}
body:not([data-view=hoje]) .top{display:none}
.top small,.mode{color:var(--mute)}
.mode{display:inline-flex;align-items:center;gap:6px}
.mode::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
h1{letter-spacing:-.015em}
.view:not([hidden]){animation:vin .22s cubic-bezier(.2,.7,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card,.lvl,.sum4 div,.seg,.ai{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
.card{transition:transform .12s,border-color .15s}
button.card:active,.btn:active,.mi:active,.chips button:active,.alist button:active{transform:scale(.98)}
button.card:hover{border-color:#2f475b}
.film,.flash,.case{border:1px solid #17283a;box-shadow:inset 0 0 0 1px rgba(92,200,230,.04),0 8px 24px rgba(0,0,0,.25)}
.film{background:linear-gradient(180deg,#08121a,var(--film))}
.viewer{border:1px solid #1b2c3b;box-shadow:0 0 0 4px #03080c}
.btn{background:var(--card2);border-color:var(--line);transition:transform .1s,filter .15s}
.btn.pri{box-shadow:0 6px 18px rgba(255,204,41,.18)}
.btn.pri:hover{filter:brightness(1.05)}
.seg button[aria-pressed=true]{background:#24394b;color:var(--ink);box-shadow:none}
.chips button[aria-pressed=true]{background:var(--yel);color:#0c161f;border-color:var(--yel)}
input:not([type=range]):not([type=checkbox]),select,textarea{background:#0a141c;border-color:var(--line)}
input:focus,select:focus,textarea:focus{border-color:var(--yel);outline:none;box-shadow:0 0 0 3px rgba(255,204,41,.18)}
.mi{background:#0f1c27}
.opts button{background:#0f1c27}
.nav{background:color-mix(in srgb,#08111a 88%,transparent);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-top-color:var(--line)}
.nav a{position:relative;gap:4px}
.nav a svg{width:24px;height:24px;padding:3px 0;box-sizing:content-box;border-radius:999px;transition:background .18s,color .18s;width:24px}
.nav a[aria-current=page]{color:var(--ink)}
.nav a[aria-current=page] svg{color:#0c161f;background:var(--yel);padding:3px 16px}
.sheet{background:#0f1b25;border:1px solid var(--line);border-bottom:0;box-shadow:0 -12px 40px rgba(0,0,0,.4)}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:#2b4052;margin:-4px auto 12px}
.shade{background:rgba(2,6,10,.66);backdrop-filter:blur(2px)}
.toast{background:#e8eff5;color:#0c161f;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translateX(-50%)}}
.atlas-info{background:#0f1b25;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.tbl th{color:var(--mute);text-transform:none}
.progress{background:#0a141c;border:1px solid var(--line)}
.alist button{background:#0f1c27}
.alist button.seen{background:#15283a;border-color:#27415a}
@media(prefers-reduced-motion:reduce){.view:not([hidden]),.toast{animation:none}.card,.btn,.nav a svg{transition:none}}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%)}
.paste{border:1.5px dashed #2f475b;border-radius:12px;padding:12px;min-height:50px;color:var(--mute);font-size:14px;margin-top:8px;outline:none;-webkit-user-select:text;user-select:text}
.paste:focus{border-color:var(--yel);color:var(--ink)}

/* estudo */
.weak{border-color:color-mix(in srgb,var(--mag) 45%,var(--line))!important}
.weak small:first-child{color:var(--mag)}
.tlist{display:grid;gap:6px;margin-top:8px}
.trow{display:grid;grid-template-columns:1fr 90px 44px;gap:10px;align-items:center;text-align:left;background:#0f1c27;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:56px}
.trow .tn{font-weight:600;font-size:15px}.trow small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.trow .tb{height:8px;border-radius:99px;background:#0a141c;overflow:hidden;border:1px solid var(--line)}.trow .tb i{display:block;height:100%;border-radius:99px}
.trow .tp{text-align:right;font-size:15px}
.tgrid{display:grid;gap:8px}
.trl{display:flex;gap:12px;align-items:center;text-align:left;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.tic{font-size:28px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:#0f1c27;flex:none}
.ttx{flex:1;display:grid;gap:3px}.ttx small{color:var(--mute);font-size:13px}.ttx .progress{margin-top:4px}
.cont-aula{width:100%;border-color:color-mix(in srgb,var(--yel) 45%,var(--line))!important}
.back{background:none;border:0;color:var(--mute);font-size:15px;padding:6px 0;margin-bottom:6px}
.trh{display:flex;gap:12px;align-items:center;margin-bottom:12px}.trh h3{font-size:22px}
.alist2{display:grid;gap:8px}
.arow{display:flex;gap:12px;align-items:center;text-align:left;background:#0f1c27;border:1px solid var(--line);border-radius:14px;padding:12px}
.arow .anum{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #2f475b;font-weight:700;flex:none}
.arow.ok .anum{background:var(--ok);border-color:var(--ok);color:#0c161f}.arow.cur{border-color:color-mix(in srgb,var(--yel) 50%,var(--line))}.arow.cur .anum{border-color:var(--yel);color:var(--yel)}
.arow .atx{font-weight:600}.arow small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.lesson{max-width:62ch}.lesson h2{font-size:27px;margin:4px 0 6px;line-height:1.15}.lmeta{color:var(--mute);font-size:13px}
.lesson p{font-size:17px;line-height:1.6;margin:12px 0}
.aul{padding-left:20px;margin:12px 0}.aul li{font-size:16.5px;line-height:1.55;margin:7px 0}
.atab{margin:12px 0;width:100%}.atab th{text-align:left;font-weight:600;padding:8px 10px 8px 0;white-space:nowrap;color:var(--ink);vertical-align:top}.atab td{padding:8px 0;color:var(--mute)}
.dica{display:grid;gap:4px;background:color-mix(in srgb,var(--yel) 9%,var(--card));border:1px solid color-mix(in srgb,var(--yel) 30%,transparent);border-radius:14px;padding:12px 14px;margin:16px 0;font-size:16px;line-height:1.5}
.dica b{color:var(--yel);font-size:14px}
.aquiz{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}

const X='<button class="x" data-close aria-label="Fechar">×</button>';

const TIPOS={trabalho:'Trabalho',aula:'Aula',estudo:'Estudo',outro:'Outro',prova:'Prova ou entrega',consulta:'Consulta médica',compromisso:'Compromisso'};
function dayItems(date){const a=D('agenda'),dw=dowOf(date);
  const it=a.rotina.filter(r=>(r.dias||[]).includes(dw)).map(r=>({...r,rot:true}));
  a.eventos.filter(e=>e.data===date).forEach(e=>it.push({...e,rot:false}));
  return it.sort((x,y)=>toMin(x.ini)-toMin(y.ini))}
function freeSlots(date){const p=D('perfil'),items=dayItems(date);let cur=toMin(p.ini);const end=toMin(p.fim),out=[];
  if(date===today()){const n=new Date();cur=Math.max(cur,n.getHours()*60+n.getMinutes())}
  for(const i of items){const s=toMin(i.ini),e=toMin(i.fim);if(s-cur>=30)out.push([cur,s]);cur=Math.max(cur,e)}
  if(end-cur>=30)out.push([cur,end]);return out}
function weekSum(){const t={trabalho:0,aula:0,estudo:0,livre:0};const base=new Date();const mon=new Date(base);mon.setDate(base.getDate()-((base.getDay()+6)%7));
  const p=D('perfil');for(let k=0;k<7;k++){const d=new Date(mon);d.setDate(mon.getDate()+k);const s=ymd(d);
    for(const i of dayItems(s)){const m=Math.max(0,toMin(i.fim)-toMin(i.ini));const tp=['trabalho','aula','estudo'].includes(i.tipo)?i.tipo:null;if(tp)t[tp]+=m}
    let cur=toMin(p.ini);for(const i of dayItems(s)){const a=toMin(i.ini);if(a-cur>=30)t.livre+=a-cur;cur=Math.max(cur,toMin(i.fim))}if(toMin(p.fim)-cur>=30)t.livre+=toMin(p.fim)-cur}
  return t}

function dueCards(deck){const e=D('estudo'),t=today();let novos=Object.values(e.srs).filter(x=>x&&x.ini===t).length;const out=[];
  for(const c of allCards()){if(deck&&deck!=='todos'&&c.deck!==deck)continue;const s=e.srs[c.id];
    if(!s){if(c.deck==='erros')out.push(c);else if(novos<12){out.push(c);novos++}}else if(s.due<=t)out.push(c)}
  return out}

let idb=null,casos=[],casosOk=null,casoFiltro='';
function idbOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open('cortefino-casos',1);r.onupgradeneeded=()=>r.result.createObjectStore('casos',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function idbAll(){return new Promise((res,rej)=>{const t=idb.transaction('casos','readonly').objectStore('casos').getAll();t.onsuccess=()=>res(t.result||[]);t.onerror=()=>rej(t.error)})}
function idbPut(v){return new Promise((res,rej)=>{const t=idb.transaction('casos','readwrite');t.objectStore('casos').put(v);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
function idbDel(id){return new Promise((res,rej)=>{const t=idb.transaction('casos','readwrite');t.objectStore('casos').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
const LSC='cortefino:caso:';
function lsAll(){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(LSC)){try{out.push({...JSON.parse(localStorage.getItem(k)),_ls:1})}catch(e){}}}}catch(e){}return out}
async function shrinkData(src,max=1000,q=.78){const im=new Image();im.src=src;await new Promise((res,rej)=>{im.onload=res;im.onerror=rej});const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
/* guarda o caso: IndexedDB com imagem; se falhar, IndexedDB com texto; se falhar, armazenamento simples */
async function casoPut(c){if(idb){if(typeof c.img!=='string'){try{await idbPut(c);return c}catch(e){}}
    try{const d={...c,img:await blobToData(c.img)};await idbPut(d);return d}catch(e){}}
  let src=await blobToData(c.img);try{src=await shrinkData(src)}catch(e){}
  const d={...c,img:src};try{localStorage.setItem(LSC+c.id,JSON.stringify(d));return {...d,_ls:1}}catch(e){throw {code:'quota'}}}
async function casoDel(c){if(c._ls){try{localStorage.removeItem(LSC+c.id)}catch(e){}}else if(idb){try{await idbDel(c.id)}catch(e){}}}
async function loadCasos(){let a=[],ok=false;try{idb=await idbOpen();a=await idbAll();ok=true}catch(e){idb=null}
  let ls=[];try{localStorage.setItem('cortefino:t','1');localStorage.removeItem('cortefino:t');ls=lsAll();ok=true}catch(e){}
  casos=[...a,...ls].sort((x,y)=>String(y.criado).localeCompare(String(x.criado)));casosOk=ok;if(view==='casos')renderCasos();if(view==='hoje'&&casos.length)renderHoje()}

async function planoOutro(){const nome=$('#cu-n').value.trim().slice(0,50);if(!nome){toast('Digite o nome do curso.');return}

  if(!sample){b.custom={nome};b.stepsBy=b.stepsBy||{};b.stepsBy.outro={};save('bio');renderMais();toast('Curso salvo.');return}

  catch(e){toast(e?.code==='rate_limited'?'Limite de uso atingido. Tente mais tarde.':'Não deu para montar o plano agora. Tente de novo.');btn.disabled=false;btn.textContent='Montar plano'}}
const blobToData=b=>typeof b==='string'?Promise.resolve(b):new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
function dataToBlob(u){const m=/^data:(image\/(?:jpeg|png|webp));base64,([A-Za-z0-9+/=]+)$/.exec(u);if(!m)return null;const bin=atob(m[2]),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m[1]})}
async function salvarArquivo(nome,blob){const f=new File([blob],nome,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Backup do Thaís Rx'});return 'share'}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=nome;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return 'download'}
async function fazerBackup(){const btn=$('#bk-dl');

    const json=JSON.stringify({app:'corte-fino',versao:1,criado:new Date().toISOString(),dados:S.data,casos:cs});
    const como=await salvarArquivo(`thais-rx-backup-${today()}.json`,new Blob([json],{type:'application/json'}));
    D('perfil').backup=today();save('perfil');toast(como==='share'?'Backup pronto. Guarde no Drive, em Arquivos ou mande para o seu e-mail.':'Backup baixado. Guarde o arquivo em local seguro.');render()}
  catch(e){toast(e?.name==='AbortError'?'Backup cancelado.':'Não foi possível criar o backup agora.')}
  finally{if($('#bk-dl'))$('#bk-dl').disabled=false}}
async function restaurar(file){try{const o=JSON.parse(await file.text());if(!o||o.app!=='corte-fino'||typeof o.dados!=='object')throw 0;
    for(const k of Object.keys(DEF)){const v=o.dados[k];if(v&&typeof v==='object'&&!Array.isArray(v)){S.data[k]={...DEF[k],...JSON.parse(JSON.stringify(v))};save(k)}}
    let n=0;if(Array.isArray(o.casos)&&casosOk){const ids=new Set(casos.map(c=>c.id));for(const c of o.casos){if(!c||typeof c.id!=='string'||ids.has(c.id))continue;const img=dataToBlob(String(c.img||''));if(!img)continue;
      const v={id:c.id.slice(0,40),titulo:String(c.titulo||'Caso').slice(0,80),exame:String(c.exame||'Outro').slice(0,30),tags:String(c.tags||'').slice(0,80),nota:String(c.nota||'').slice(0,2000),criado:String(c.criado||new Date().toISOString()).slice(0,30),img};
      try{casos.push(await casoPut(v));n++}catch(e){}}casos.sort((a,b)=>String(b.criado).localeCompare(String(a.criado)))}
    rev=null;quiz=null;toast(`Backup restaurado${n?`, com ${n} ${n===1?'caso':'casos'}`:''}.`);render()}
  catch(e){toast('Esse arquivo não é um backup válido do Thaís Rx.');const c=$('#bk-cf');if(c)c.hidden=true}}

  ['p','Antes do contraste, a triagem pergunta sobre reação prévia a contraste, alergias graves, asma, função renal (creatinina e taxa de filtração em pacientes de risco), uso de metformina e gravidez. Cada serviço tem seu protocolo; o técnico garante que a triagem foi feita.'],
  ['p','As reações podem ser leves (náusea, coceira, urticária localizada), moderadas ou graves (falta de ar, queda de pressão, inchaço de glote). A maioria das reações graves acontece nos primeiros 20 minutos.'],
  ['ul',['Reação grave: interrompa a injeção, chame a equipe médica e acione o protocolo de emergência.','Extravasamento: pare a injeção, eleve o membro, avise o médico e registre.','Observe o paciente depois do exame, pelo tempo que o protocolo pede.']],
  ['dica','Saiba onde ficam o carrinho de emergência e o oxigênio da sala antes de precisar deles.']],
  q:[['A maioria das reações graves ao contraste iodado acontece:',['Nos primeiros 20 minutos após a injeção','Só no dia seguinte','Uma semana depois','Antes da injeção'],'Por isso o paciente fica em observação logo depois do exame.'],
   ['Diante de falta de ar e queda de pressão após o contraste, o técnico deve:',['Interromper a injeção e acionar a equipe médica','Terminar o exame primeiro','Liberar o paciente','Aumentar o fluxo'],'É uma reação grave: emergência.'],
   ['Na triagem para contraste iodado, pergunta-se sobre:',['Reação prévia, função renal e uso de metformina','Só o tipo sanguíneo','Só a altura do paciente','Só a hora da última refeição'],'Esses dados orientam a decisão médica.']]}]},
{id:'dose',tema:'dose',n:'Dose e proteção',ic:'☢️',d:'Grandezas de dose, princípios de proteção e como reduzir dose na rotina.',aulas:[
 {id:'dose1',t:'As grandezas de dose da TC',min:3,b:[
  ['p','O CTDIvol, em mGy, indica a intensidade da radiação por corte, medida num fantoma padrão. Não é a dose exata do paciente, mas permite comparar protocolos e equipamentos.'],
  ['p','O DLP, em mGy·cm, é o CTDIvol multiplicado pelo comprimento varrido: mostra a dose total do exame. Varrer além do necessário aumenta o DLP sem ganho nenhum.'],
  ['p','A dose efetiva, em mSv, estima o risco para o corpo inteiro: DLP × coeficiente k da região. Uma TC de crânio fica perto de 1 a 2 mSv; uma de tórax, perto de 5 a 7 mSv.'],
  ['dica','O relatório de dose aparece no fim do exame. Compare o CTDIvol com os níveis de referência do serviço e investigue quando um exame foge muito do habitual.']],
  q:[['O DLP aumenta quando:',['A área varrida fica maior','O kV diminui','O FOV diminui','A janela muda'],'DLP = CTDIvol × comprimento varrido.'],
   ['O CTDIvol representa:',['A intensidade da radiação por corte, medida em fantoma','A dose exata do paciente','A dose efetiva','O tempo do exame'],'É um índice do equipamento, útil para comparar protocolos.'],
   ['Uma TC de crânio de rotina tem dose efetiva perto de:',['1 a 2 mSv','50 mSv','0,01 mSv','100 mSv'],'É menor que a de tórax ou abdome.']]},
 {id:'dose2',t:'Princípios de proteção',min:3,b:[
  ['p','Justificação: o exame só é feito se o benefício superar o risco. Otimização (ALARA): a menor dose capaz de responder à pergunta clínica. Limitação: limites de dose para trabalhadores e público, que não se aplicam ao paciente.'],
  ['p','Para o trabalhador, valem tempo, distância e blindagem: menos tempo perto da fonte, mais distância (a intensidade cai com o quadrado dela) e barreiras como avental e vidro plumbífero.'],
  ['tab',[['Trabalhador','20 mSv/ano (média de 5 anos, até 50 em um ano)'],['Público','1 mSv/ano']]],
  ['dica','Durante a aquisição da TC, o lugar mais seguro é a sala de comando. Se alguém precisar ficar na sala, use avental e mantenha distância do gantry.']],
  q:[['A limitação de dose vale para:',['Trabalhadores e público, não para o paciente','Só o paciente','Só crianças','Só a ressonância'],'Para o paciente valem justificação e otimização.'],
   ['Otimização (ALARA) na TC significa:',['Usar a menor dose que ainda responde à pergunta clínica','Usar a menor dose possível, mesmo com imagem ruim','Usar a mesma técnica para todos','Repetir o exame para garantir'],'Imagem ruim que obriga a repetir também é falha de otimização.'],
   ['Se um acompanhante precisa ficar na sala durante a TC, ele deve:',['Usar avental e ficar o mais longe possível do gantry','Ficar ao lado do tubo','Segurar o paciente sem proteção','Ficar dentro do gantry'],'Distância e blindagem reduzem muito a exposição.']]},
 {id:'dose3',t:'Como reduzir dose na prática',min:3,b:[
  ['ul',['Limite a varredura ao necessário, com o topograma bem planejado.','Centralize o paciente no gantry.','Use modulação automática de corrente e kV adequado ao tamanho.','Use reconstrução iterativa quando o protocolo prevê.','Em crianças, use protocolos pediátricos.','Evite fases que o pedido não justifica.']],
  ['p','A centralização importa: o filtro bowtie e a modulação contam com o paciente no isocentro. Paciente alto ou baixo demais na mesa recebe mais dose na pele e tem mais ruído na imagem.'],
  ['dica','Antes de cada exame, confira protocolo, idade e peso. Protocolo de adulto em criança é um dos erros de dose mais comuns.']],
  q:[['Paciente fora do centro do gantry tende a:',['Receber mais dose e ter mais ruído','Receber menos dose','Ficar com a imagem igual','Ter menos artefatos'],'O filtro bowtie e a modulação contam com o paciente no isocentro.'],
   ['Uma forma simples de reduzir o DLP é:',['Limitar a varredura à região necessária','Reduzir o pitch para 0,5','Acrescentar fases','Usar sempre cortes de 0,5 mm'],'Varrer além do necessário só soma dose.'],
   ['Em crianças, a recomendação é:',['Usar protocolos pediátricos ajustados ao tamanho','Usar o protocolo de adulto','Dobrar o mAs','Fazer sempre duas fases'],'Crianças são mais sensíveis à radiação.']]}]},
{id:'art',tema:'art',n:'Artefatos',ic:'〰️',d:'Reconhecer, evitar e corrigir os artefatos mais comuns.',aulas:[
 {id:'art1',t:'Artefatos do paciente',min:3,b:[
  ['ul',['Movimento: borramento, contornos duplicados e estrias. Previna com orientação, apneia treinada e imobilização.','Metal: estrias claras e escuras em volta de próteses, clipes e obturações. Ajuda usar redução de artefato metálico (MAR) e kV mais alto.','Objetos externos: brincos, grampos, sutiã com aro e roupas com metal devem sair antes.','Corpo fora do FOV: artefato de truncamento nas bordas.']],
  ['dica','Treine a apneia antes da aquisição: peça para puxar o ar, segurar e conte junto. Na hora do exame, o paciente já sabe o que fazer.']],
  q:[['Antes de uma TC de crânio, o que deve ser retirado?',['Brincos, grampos e próteses removíveis','Só o relógio','Nada, a TC ignora metais','Só a roupa'],'Metal na área estudada causa estrias.'],
   ['Para reduzir artefato de metal, pode-se usar:',['Algoritmo de redução de artefato metálico (MAR)','kV mais baixo','Sempre o filtro mais suave','Cortes mais grossos sem mudar mais nada'],'MAR e kV mais alto ajudam.'],
   ['Partes do corpo fora do campo de aquisição causam:',['Artefato de truncamento nas bordas','Imagem mais nítida','Menos dose','Artefato em anel'],'Posicione o paciente todo dentro do campo.']]},
 {id:'art2',t:'Artefatos físicos',min:3,b:[
  ['ul',['Endurecimento do feixe: ao atravessar osso denso, o feixe perde fótons de baixa energia; surgem faixas escuras entre estruturas densas, como entre os rochedos.','Volume parcial: o voxel com tecidos diferentes mostra a média; bordas e lesões pequenas ficam falseadas. Cortes finos ajudam.','Falta de fótons: em regiões muito atenuantes, como ombros e pelve, poucos fótons chegam ao detector e aparecem estrias horizontais.','Ruído: granulação que aumenta em pacientes grandes e em cortes finos.']],
  ['dica','No tórax e no abdome, posicione os braços acima da cabeça quando o protocolo permitir. Tirar os braços do campo reduz muito as estrias.']],
  q:[['Estrias horizontais na altura dos ombros, numa TC de tórax, costumam vir de:',['Falta de fótons','Artefato em anel','Contraste oral','Volume parcial'],'Muito osso e tecido no caminho deixam poucos fótons chegarem ao detector.'],
   ['Para reduzir artefatos no tórax e no abdome, os braços devem ficar:',['Acima da cabeça, quando possível','Ao lado do corpo','Cruzados sobre o abdome','Sob as costas'],'Tirar os braços do campo reduz atenuação e estrias.'],
   ['Uma lesão menor que a espessura do corte pode:',['Ter o HU falseado pelo volume parcial','Ficar sempre mais densa do que é','Causar artefato em anel','Aumentar a dose'],'Cortes finos reduzem o volume parcial.']]},
 {id:'art3',t:'Artefatos do equipamento',min:3,b:[
  ['ul',['Anel: anéis concêntricos por detector descalibrado ou com defeito. Resolve com calibração e, se persistir, assistência técnica.','Moinho de vento: padrões em hélice ao redor de estruturas densas, em aquisições helicoidais com pitch alto.','Cone beam: bordas distorcidas em equipamentos com muitas fileiras de detectores.']],
  ['dica','Faça as calibrações diárias e o controle de qualidade no horário previsto. Anel que aparece em todas as imagens é motivo para avisar a física médica ou a assistência.']],
  q:[['Anéis concêntricos em todas as imagens sugerem:',['Problema de calibração ou de detector','Movimento do paciente','Excesso de contraste','Paciente obeso'],'Calibre e, se continuar, chame a assistência técnica.'],
   ['A calibração de ar do tomógrafo serve para:',['Ajustar a resposta dos detectores','Aquecer o contraste','Medir a dose do paciente','Mudar a janela padrão'],'Detectores bem calibrados evitam anéis e faixas.'],
   ['O artefato em moinho de vento aparece mais em:',['Aquisições helicoidais com pitch alto','Radiografias simples','Ressonância','Ultrassom'],'Pitch menor reduz o efeito.']]}]},
{id:'anat',tema:'anat',n:'Anatomia seccional',ic:'🫁',d:'Ler cortes axiais e reconhecer as estruturas de crânio, tórax e abdome.',aulas:[
 {id:'anat1',t:'Como ler um corte axial',min:3,b:[
  ['p','Por convenção, o corte axial é visto como se você estivesse nos pés do paciente, olhando para a cabeça. Assim, o lado direito do paciente aparece à esquerda da tela e a frente do paciente fica em cima.'],
  ['ul',['R, a direita do paciente, fica à esquerda da tela; L fica à direita; A fica em cima.','No coronal, você vê o paciente de frente: a direita dele também fica à esquerda da tela.','No sagital, a frente costuma ficar à esquerda.']],
  ['p','Use pontos fixos para se localizar: no abdome, o fígado à esquerda da tela; a aorta um pouco à direita do centro; a coluna embaixo, no meio.'],
  ['dica','Na aba Corpo, no modo Cortes de TC, toque nas estruturas de cada corte para treinar a orientação.']],
  q:[['Num corte axial padrão, o fígado aparece:',['À esquerda da tela','À direita da tela','Em cima, no centro','Embaixo, atrás da coluna'],'O lado direito do paciente aparece à esquerda da tela.'],
   ['Num corte axial, a parte de cima da imagem corresponde a:',['A frente do paciente','As costas','A cabeça','Os pés'],'Anterior em cima, posterior embaixo.'],
   ['O corte axial é visto como se o observador estivesse:',['Nos pés do paciente, olhando para a cabeça','Na cabeça, olhando para os pés','Atrás do paciente','Ao lado do paciente'],'Por isso direita e esquerda ficam trocadas na tela.']]},
 {id:'anat2',t:'Crânio no axial',min:3,b:[
  ['p','Na altura dos ventrículos laterais, procure os cornos frontais em forma de borboleta, a cabeça do núcleo caudado na parede lateral deles e o núcleo lentiforme mais para fora.'],
  ['p','Entre eles fica a cápsula interna. Mais atrás, os tálamos ladeiam o terceiro ventrículo, uma fenda fina na linha média. Pineal e plexos coroides calcificados são achados comuns em adultos.'],
  ['ul',['A substância cinzenta (córtex e núcleos) é mais clara que a branca.','Sulcos e cisternas têm líquor e ficam escuros.','A foice do cérebro é uma linha fina na linha média.']],
  ['dica','Desvio da linha média, sulcos apagados e ventrículos assimétricos são sinais de alerta. Ao perceber, avise o médico antes de liberar o paciente.']],
  q:[['A cabeça do núcleo caudado fica:',['Na parede lateral do corno frontal do ventrículo lateral','Dentro do terceiro ventrículo','No cerebelo','Fora da calota'],'É referência fácil nos cortes na altura dos ventrículos.'],
   ['Na TC sem contraste, a substância cinzenta aparece:',['Mais clara que a substância branca','Mais escura que a branca','Igual ao líquor','Igual ao osso'],'Cinzenta tem cerca de 35 a 45 HU; branca, 20 a 30.'],
   ['O terceiro ventrículo fica:',['Na linha média, entre os tálamos','No lobo frontal','No cerebelo','Fora do cérebro'],'Aparece como uma fenda fina e escura.']]},
 {id:'anat3',t:'Tórax no axial',min:3,b:[
  ['p','Na altura da carina, procure: aorta ascendente na frente, perto do centro; tronco da artéria pulmonar à direita da tela; veia cava superior à esquerda da tela; aorta descendente atrás, ao lado da coluna, à direita da tela; esôfago logo à frente da coluna.'],
  ['p','Na janela de pulmão, os brônquios principais saem da carina, as fissuras aparecem como linhas finas e os vasos são mais grossos perto do hilo e afinam na periferia.'],
  ['dica','Na angio-TC para embolia pulmonar, o pico de contraste precisa estar nas artérias pulmonares. Por isso a ROI de monitoração vai no tronco pulmonar, não na aorta.']],
  q:[['Na angio-TC para embolia pulmonar, a ROI de monitoração fica:',['No tronco da artéria pulmonar','Na aorta abdominal','Na veia femoral','No ventrículo esquerdo'],'O objetivo é o pico de contraste nas artérias pulmonares.'],
   ['No corte axial do tórax, a aorta descendente fica:',['Atrás, ao lado da coluna, à direita da tela','Na frente do esterno','Dentro do pulmão direito','À esquerda da tela, na frente'],'Ela desce pelo lado esquerdo do paciente, junto à coluna.'],
   ['Na janela de pulmão, os vasos:',['São mais grossos perto do hilo e afinam na periferia','Têm a mesma espessura em todo o pulmão','Ficam pretos','Não aparecem'],'Um ponto que não continua nos cortes vizinhos pode ser nódulo.']]},
 {id:'anat4',t:'Abdome no axial',min:3,b:[
  ['p','No andar superior: fígado à esquerda da tela, com a vesícula embaixo dele; estômago e baço à direita da tela. No centro, a aorta fica na frente da coluna, um pouco à direita da tela, e a veia cava inferior fica à esquerda da tela.'],
  ['p','Um pouco abaixo, o pâncreas cruza na frente da aorta, com a cabeça encaixada no duodeno e a cauda chegando perto do baço. A veia esplênica corre atrás do pâncreas e ajuda a encontrá-lo.'],
  ['ul',['Rins no retroperitônio, um de cada lado da coluna; o direito costuma ficar um pouco mais baixo.','Músculos psoas ao lado das vértebras lombares.','Cólon com gás nos flancos.']],
  ['dica','Na fase portal, fígado e baço realçam de forma homogênea. Baço heterogêneo na fase arterial é normal: não confunda com lesão.']],
  q:[['A veia esplênica é boa referência para achar:',['O pâncreas, que fica na frente dela','O rim direito','A vesícula','O apêndice'],'Ela corre atrás do corpo e da cauda do pâncreas.'],
   ['No abdome axial, a veia cava inferior fica:',['À esquerda da tela, do lado direito do paciente','À direita da tela','Dentro do estômago','Atrás da coluna'],'A aorta fica à direita da tela e a cava à esquerda.'],
   ['O baço aparece no corte axial:',['À direita da tela, atrás do estômago','À esquerda da tela, junto ao fígado','No centro, na frente da aorta','Na pelve'],'Lado esquerdo do paciente = direita da tela.']]}]},
{id:'pat',tema:'pat',n:'Urgências na imagem',ic:'🚨',d:'Achados que o técnico precisa reconhecer e comunicar na hora.',aulas:[
 {id:'pat1',t:'Urgências no crânio',min:3,b:[
  ['tab',[['Epidural','Biconvexo, em lente; não cruza suturas'],['Subdural','Em crescente; cruza suturas e acompanha a calota'],['Subaracnoide','Sangue nos sulcos e nas cisternas'],['Intraparenquimatosa','Coleção de sangue dentro do cérebro'],['AVC isquêmico inicial','A TC pode ser normal; depois surge área escura']]],
  ['p','A TC sem contraste é o primeiro exame na suspeita de AVC porque descarta sangramento, o que muda todo o tratamento. Tempo é cérebro: o exame precisa ser rápido.'],
  ['dica','No protocolo de AVC, deixe a sala pronta, priorize o paciente e envie as imagens assim que terminar. Se vir sangue evidente, avise o médico na hora.']],
  q:[['Hematoma em crescente que cruza suturas e acompanha a calota é:',['Subdural','Epidural','Subaracnoide','Intraparenquimatoso'],'O epidural é biconvexo e não cruza suturas.'],
   ['Sangue nos sulcos e nas cisternas sugere:',['Hemorragia subaracnoide','Hematoma epidural','AVC isquêmico antigo','Artefato'],'Costuma vir de aneurisma roto ou de trauma.'],
   ['Na suspeita de AVC, a TC sem contraste serve principalmente para:',['Descartar sangramento','Mostrar sempre a isquemia nas primeiras horas','Medir a pressão','Substituir a avaliação médica'],'Nas primeiras horas, a isquemia pode não aparecer.']]},
 {id:'pat2',t:'Urgências no tórax',min:3,b:[
  ['ul',['Embolia pulmonar: falha de enchimento escura dentro das artérias pulmonares.','Dissecção de aorta: membrana (flap) separando luz verdadeira e falsa.','Pneumotórax: ar na pleura, sem vasos, com o pulmão afastado da parede.','Derrame pleural: líquido em crescente na base, na parte de trás.']],
  ['p','Na suspeita de dissecção, a angio costuma cobrir do tórax à pelve, para mostrar até onde ela vai e se atinge as artérias dos órgãos.'],
  ['dica','Paciente com dor torácica intensa e súbita é prioridade. Se o protocolo permitir, deixe bomba e acesso prontos antes de ele chegar.']],
  q:[['Líquido em crescente na base posterior do tórax sugere:',['Derrame pleural','Pneumotórax','Embolia pulmonar','Enfisema'],'O líquido vai para a parte mais baixa, que no paciente deitado é a de trás.'],
   ['Na suspeita de dissecção de aorta, a angio-TC costuma cobrir:',['Do tórax à pelve','Só o crânio','Só o pescoço','Só o abdome superior'],'É preciso ver a extensão e os ramos atingidos.'],
   ['No pneumotórax, a região com ar na pleura:',['Não tem vasos pulmonares','Tem mais vasos','Fica branca','Sempre tem nível líquido'],'O pulmão colabado fica afastado da parede.']]},
 {id:'pat3',t:'Urgências no abdome',min:3,b:[
  ['ul',['Pneumoperitônio: ar livre fora das alças, por perfuração.','Apendicite: apêndice espessado, acima de cerca de 6 mm, com a gordura ao redor densificada.','Obstrução intestinal: alças dilatadas, com níveis e ponto de transição.','Cálculo urinário: denso na fase sem contraste, com dilatação acima dele.','Sangramento ativo: contraste que extravasa e aumenta nas fases tardias.']],
  ['dica','Ar livre no abdome é comunicado na hora. Use a janela de pulmão no abdome para achar bolhas pequenas.']],
  q:[['Para achar pequenas bolhas de ar livre no abdome, a melhor janela é:',['De pulmão','De cérebro','De fígado','Subdural'],'A janela larga separa bem o ar da gordura.'],
   ['O cálculo urinário é avaliado melhor na fase:',['Sem contraste','Arterial','Portal','Excretora'],'O contraste nas vias urinárias pode esconder o cálculo.'],
   ['Contraste que extravasa e aumenta nas fases tardias sugere:',['Sangramento ativo','Cálculo','Artefato de movimento','Gordura normal'],'É urgência: avise na hora.']]}]},
];

/* ================= estudo: temas, desempenho, erros ================= */
const TEMAS={jan:'Janelas e HU',fis:'Física e técnica',dose:'Dose e segurança',cont:'Contraste',art:'Artefatos',pos:'Posicionamento e planos',anat:'Anatomia',pat:'Achados e urgências',prof:'Profissão e história'};
const QT='jjjfdfaaddddpfcccddpp'+'jjjjjj'+'dddffodccaaaffoooccccdddffppfannnuuuup'+'n'.repeat(20)+'f'.repeat(12)+'a'+'o'.repeat(8)+'c'.repeat(6)+'d'.repeat(5)+'u'.repeat(4)+'p'.repeat(4);
const QC={j:'jan',f:'fis',d:'dose',c:'cont',a:'art',o:'pos',n:'anat',u:'pat',p:'prof'};
QUIZ.forEach((q,i)=>{q[3]=QC[QT[i]]||'prof'});
const DK2T={janelas:'jan',fisica:'fis',artefatos:'art',contraste:'cont',protecao:'dose'};
let QBC=null;const QB=()=>QBC||(QBC=[...QUIZ,...TRILHAS.flatMap(t=>t.aulas.flatMap(a=>a.q.map(q=>[q[0],q[1],q[2],t.tema])))]);
function regStat(t,ok){if(!t||!TEMAS[t])return;const e=D('estudo');e.stats=e.stats||{};const x=e.stats[t]||(e.stats[t]={a:0,t:0});x.t++;if(ok)x.a++;save('estudo')}
function addErro(p,certa,exp,t){const e=D('estudo');if(e.meus.some(m=>m.erro&&m.f===p))return false;
  e.meus.push({id:'e'+uid(),f:String(p).slice(0,200),v:(certa+'. '+(exp||'')).slice(0,500),aula:'Erros do quiz',erro:1,tema:t||''});save('estudo');return true}
function temaStats(){const s=D('estudo').stats||{};return Object.keys(TEMAS).map(k=>{const x=s[k]||{a:0,t:0};return{k,n:TEMAS[k],a:x.a,t:x.t,p:x.t?x.a/x.t:null}})}
function pontoFraco(){return temaStats().filter(x=>x.t>=5&&x.p<.85).sort((a,b)=>a.p-b.p)[0]||null}
function renderQuizHome(){const b=$('#eBody'),ts=temaStats(),fr=pontoFraco(),er=D('estudo').meus.filter(m=>m.erro).length;
  const cor=p=>p==null?'transparent':p<.6?'var(--mag)':p<.8?'var(--yel)':'var(--ok)';
  b.innerHTML=`<div class="cards" style="margin-top:4px">
   <button class="card" id="qAll"><small>Quiz geral</small><b>15 perguntas de todos os temas</b><small>${QB().length} perguntas no banco</small></button>

<script>
(function(){
  const P=[
   ['💜','Bem-vinda ao Thaís Rx','Seu app de estudos de radiologia e tomografia, feito para a sua rotina. Veja em 1 minuto tudo o que dá para fazer.',[]],
   ['🏠','Hoje','A tela inicial resume o seu dia.',['<b>Cards para revisar</b> e quanto você já estudou hoje','<b>Missões do dia</b>, XP, níveis e dias seguidos estudando 🔥','<b>Agenda da área</b>: o próximo congresso ou evento e os prazos de inscrição','Atalhos para a próxima aula, o seu ponto fraco e o desafio do corpo']],

   ['🦴','Corpo','Um atlas do corpo humano para estudar anatomia.',['Toque num osso ou órgão para ver o que é e <b>como aparece nos exames</b>','Use o <b>zoom</b> para as estruturas pequenas','<b>Desafio:</b> ache 10 estruturas e bata o seu recorde','<b>Cortes de TC:</b> treine a anatomia nos cortes']],
   ['🔍','Consulta','Para consultar no dia a dia.',['<b>Simulador de TC:</b> arraste a imagem para mudar a janela','<b>Janelas prontas</b> de cérebro, pulmão, osso, abdome e outras','Referências rápidas e fontes confiáveis da área']],
   ['📁','Casos','Guarde imagens que te ensinaram algo.',['Salve casos <b>com tarja</b> sobre os dados do paciente','Ajuste brilho e contraste para estudar a imagem','<b>Backup:</b> salve um arquivo com tudo do app no celular ou na nuvem']],
   ['🎯','Meta','O seu próximo passo na carreira.',['Escolha o curso, como <b>Biomedicina</b>, e siga o passo a passo','<b>Compare faculdades</b> por preço, horário e nota do MEC','<b>Agenda da área:</b> congressos de TC, RM e mais, com o botão <b>Quero ir</b>']],
   ['✨','Tudo pronto!','Algumas dicas para começar bem:',['Seus dados ficam <b>só neste celular</b>: faça um backup de vez em quando em Casos','Cumpra as missões do dia para ganhar XP e conquistas','Para ver este manual de novo, toque no nome <b>Thaís Rx</b> lá no topo']]];
  const box=document.getElementById('tour'),body=document.getElementById('tourBody'),dots=document.getElementById('tourDots'),prev=document.getElementById('tourPrev'),next=document.getElementById('tourNext');let i=0;
  document.getElementById('tourBrand').innerHTML='<svg viewBox="0 0 32 32" aria-hidden="true">'+document.querySelector('.brand svg').innerHTML+'</svg>Thaís Rx';

    dots.innerHTML=P.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('');prev.disabled=i===0;next.textContent=i===P.length-1?'Começar':'Próximo';body.scrollTop=0}
  function fechar(){box.hidden=true;try{localStorage.setItem('cortefino:manual','1')}catch(e){}document.body.style.overflow=''}
  window.abrirManual=function(){i=0;show();box.hidden=false;document.body.style.overflow='hidden'};
  const CARTA={"iv": "8LY3q5qXSTI5DgOn", "ct": "RF2i0oWVs9HkXP5hVDz0o_f7zIH8iJMv3Z6h85ikt1K8cVI6G0KOYFYjEP6ZBY9ERY7ppC6XFT_XFKYzu3n0A6fucAXCIMA5l9Ljkj2_CvnRr--t__CGZqJbTabN0uxLtNbqSW8LKebSLCFQO6jMsDsAvVEl-KiskackqYr84ybyMZ4TV_bj91NWvyNO-BU7KyECMWK00MUKCVpNIZoj8leQ-jWuQCdwwKV-YR3vOKoVnIKYm0md1jzJ0UUhqDMk4wM7eLph70HuKgYVW2iicBMPt1YujgT4eSS0wI_nw-xBuS1UChU1AZ2eJb2JC_OJr24wmfAzMdyIluE98dKQIJLeDU0OjHsd1m4ALhRFDHJod2f8EOaiYjR2d0a8s4m0MtziRPQArGhp0FbJI3VmGFmAWpfdvEiQeQbz7pqWZ0s6o1A"};
  const ub=t=>Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((t.length+3)%4)),c=>c.charCodeAt(0));
  async function abrirCarta(){let k=null;try{k=new URLSearchParams(location.search).get('m')}catch(e){}
    try{if(k)localStorage.setItem('cortefino:mkey',k);else k=localStorage.getItem('cortefino:mkey')}catch(e){}
    if(!k||!window.crypto||!crypto.subtle)return;
    try{const key=await crypto.subtle.importKey('raw',ub(k),'AES-GCM',false,['decrypt']);
      const txt=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(CARTA.iv)},key,ub(CARTA.ct)));
